<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Table Example</title>
    <!-- Add any required CSS or Bootstrap links here -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function () {
            // 为按钮绑定点击事件
            $('#fetchDataButton').click(function () {
                // AJAX 请求获取数据
                $.ajax({
                    url: '/baselines',
                    method: 'GET',
                    success: function (data) {
                        // 清空现有的表格行
                        $('tbody').empty();

                        // 动态填充表格
                        $.each(data, function (index, baseline) {
                            var row = `
                                <tr>
                                    <td>
                                        <div class="form-check form-check-sm form-check-custom form-check-solid">
                                            <input class="form-check-input widget-9-check" type="checkbox" value="1">
                                        </div>
                                    </td>
                                    <td>
                                        <div class="d-flex align-items-center">
                                            <div class="d-flex justify-content-start flex-column">
                                                <a href="#" class="text-dark fw-bolder text-hover-primary fs-6">${baseline.baseline_name}</a>
                                            </div>
                                        </div>
                                    </td>
                                    <td>
                                        <a href="#" class="text-dark fw-bolder text-hover-primary d-block fs-6">${baseline.baseline_status}</a>
                                    </td>
                                    <td class="text-end">
                                        <div class="d-flex flex-column w-100 me-2">
                                            <div class="d-flex flex-stack mb-2">
                                                <span class="text-muted me-2 fs-7 fw-bold">${baseline.owner}</span>
                                            </div>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="d-flex justify-content-end flex-shrink-0">
                                            <div class="d-flex flex-stack mb-2">
                                                <span class="text-muted me-2 fs-7 fw-bold">${new Date(baseline.timestamp).toLocaleString()}</span>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                            `;
                            $('tbody').append(row);
                        });
                    },
                    error: function (error) {
                        console.error('Error fetching data:', error);
                        alert('Failed to fetch data. Please check the console for more details.');
                    }
                });
            });
            // 为提交按钮绑定点击事件
            $('#submitBaselineButton').click(function (event) {
                event.preventDefault(); // 阻止表单默认提交行为

                var baselineName = $('#baselineNameInput').val();
                var baseline_status = $('#statusInput').val();
                var owner = $('#ownerInput').val();
                var time = new Date().toISOString(); // 获取当前时间

                // AJAX POST 请求提交数据
                $.ajax({
                    url: '/baseline',
                    method: 'POST',
                    data: JSON.stringify({baseline_name: baselineName, baseline_status: baseline_status, owner: owner, time: time}),
                    contentType: 'application/json',
                    success: function (response) {
                        alert('Baseline added successfully!');
                        // 重新加载数据
                        $('#fetchDataButton').click();
                    },
                    error: function (error) {
                        console.error('Error adding baseline:', error);
                        alert('Failed to add baseline. Please check the console for more details.');
                    }
                });
            });
        });
    </script>
</head>
<body>
    <!-- 容器，用于居中和边距 -->
    <div class="container mt-5">
        <!-- 按钮，用于触发数据获取 -->
        <button id="fetchDataButton" class="btn btn-primary">Fetch Baselines</button>
        <br><br>
        <!-- 添加Baseline的表单 -->
        <form id="addBaselineForm">
            <div class="mb-3">
                <label for="baselineNameInput" class="form-label">Baseline Name</label>
                <input type="text" class="form-control" id="baselineNameInput" placeholder="Enter Baseline Name">
            </div>
            <div class="mb-3">
                <label for="statusInput" class="form-label">Status</label>
                <input type="text" class="form-control" id="statusInput" placeholder="Enter Status">
            </div>
            <div class="mb-3">
                <label for="ownerInput" class="form-label">Owner</label>
                <input type="text" class="form-control" id="ownerInput" placeholder="Enter Owner">
            </div>
            <button id="submitBaselineButton" class="btn btn-success">Add Baseline</button>
        </form>
        <br>
        <!-- 表格 -->
        <table class="table table-row-dashed table-row-gray-300 align-middle gs-0 gy-4">
            <!-- 表头 -->
            <thead>
                <tr class="fw-bolder text-muted">
                    <th class="w-25px">
                        <div class="form-check form-check-sm form-check-custom form-check-solid">
                            <input class="form-check-input" type="checkbox" value="1" data-kt-check="true" data-kt-check-target=".widget-9-check">
                        </div>
                    </th>
                    <th class="min-w-200px">BaseLine Name</th>
                    <th class="min-w-150px">BaseLine Status</th>
                    <th class="min-w-150px">Owner</th>
                    <th class="min-w-100px text-end">Time</th>
                </tr>
            </thead>
            <!-- 表体 -->
            <tbody>
            </tbody>
        </table>
    </div>

    <!-- Add any required JavaScript or Bootstrap scripts here -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
