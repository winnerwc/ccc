<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project and Baseline Information</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">中台展示</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#" id="baselinesLink">Baselines</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="projectsLink">Projects</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4" id="contentContainer">
        <!-- Baselines 页面 -->
        <div id="baselinesPage" class="tab-content">
            <h2>Baseline Information</h2>
            <!-- 添加Baseline的表单 -->
            <form id="addBaselineForm">
                <div class="mb-3">
                    <label for="baselineNameInput" class="form-label">Baseline Name</label>
                    <input type="text" class="form-control" id="baselineNameInput" placeholder="Enter Baseline Name">
                </div>
                <div class="mb-3">
                    <label for="statusInput" class="form-label">Status</label>
                    <input type="text" class="form-control" id="statusInput" placeholder="Enter Status">
                </div>
                <div class="mb-3">
                    <label for="ownerInput" class="form-label">Owner</label>
                    <input type="text" class="form-control" id="ownerInput" placeholder="Enter Owner">
                </div>
                <button id="submitBaselineButton" class="btn btn-success">Add Baseline</button>
            </form>
            <br>
            <button class="btn btn-primary mb-3" id="getBaselinesButton">Get Baselines</button>
            <div class="table-responsive">
                <table class="table table-striped table-bordered" id="baselinesTable">
                    <thead class="thead-dark">
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Baseline Name</th>
                            <th scope="col">Status</th>
                            <th scope="col">Owner</th>
                            <th scope="col">Time</th>
                        </tr>
                    </thead>
                    <tbody id="baselinesBody"></tbody>
                </table>
            </div>
        </div>
        <!-- 增加Projects 页面 -->
        <!-- 查询Projects 页面 -->
        <div id="projectsPage" class="tab-content" style="display: none;">
            <form id="addBaselineForm">
                <div class="mb-3">
                    <label for="baselineNameInput" class="form-label">项目名称</label>
                    <input type="text" class="form-control" id="baselineNameInput" placeholder="Enter Baseline Name">
                </div>
                <div class="mb-3">
                    <label for="statusInput" class="form-label">工作名称</label>
                    <input type="text" class="form-control" id="statusInput" placeholder="Enter Status">
                </div>
                <div class="mb-3">
                    <label for="ownerInput" class="form-label">工作编号</label>
                    <input type="text" class="form-control" id="ownerInput" placeholder="Enter Owner">
                </div>
                <div class="mb-3">
                    <label for="baselineNameInput" class="form-label">工作状态</label>
                    <input type="text" class="form-control" id="baselineNameInput" placeholder="Enter Baseline Name">
                </div>
                <div class="mb-3">
                    <label for="statusInput" class="form-label">失败原因</label>
                    <input type="text" class="form-control" id="statusInput" placeholder="Enter Status">
                </div>
                <div class="mb-3">
                    <label for="ownerInput" class="form-label">所有者</label>
                    <input type="text" class="form-control" id="ownerInput" placeholder="Enter Owner">
                </div>
                <button id="submitJobButton" class="btn btn-success">Add Job</button>
            </form>
            <h2>Project Information</h2>
            <form id="projectQueryForm" class="mb-3">
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="Enter project name" id="projectNameInput">
                    <button class="btn btn-outline-secondary" type="button" id="queryProjectsButton">Query Projects</button>
                </div>
            </form>
            <div class="table-responsive">
                <table class="table table-striped table-bordered" id="projectsTable">
                    <thead class="thead-dark">
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">项目名称</th>
                            <th scope="col">工作名称</th>
                            <th scope="col">工作编号</th>
                            <th scope="col">工作状态</th>
                            <th scope="col">失败原因</th>
                            <th scope="col">所有者</th>
                            <th scope="col">时间</th>
                        </tr>
                    </thead>
                    <tbody id="projectsBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
